name: Host regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zstd
      - name: Test firmware staging
        run: python3 tools/test-firmware.py -v
      - name: Test xlat12 register translation and bounds
        run: |
          make -C src/xlat12 CC=clang build/test_xlat12 build/fuzz_xlat12
          src/xlat12/build/test_xlat12
          src/xlat12/build/fuzz_xlat12 200000
      - name: Test ReBAR planning and source invariants
        shell: bash
        run: |
          log="$RUNNER_TEMP/native_rebar.log"
          if { clang++ -std=c++17 -Wall -Wextra -Werror -O1 \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I src/navi48-bringup/src -I src/navi48-bringup/src/amd \
            src/navi48-bringup/tests/native_rebar_test.cpp \
            -o "$RUNNER_TEMP/native_rebar" &&
            "$RUNNER_TEMP/native_rebar" . --public-checkout; } >"$log" 2>&1; then
            cat "$log"
          else
            cat "$log"
            grep -E 'error:|FAIL[: ]' "$log" | head -20 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done || true
            exit 1
          fi

      - name: Test n48xlate C ABI and visible-function linking
        run: |
          translator="$RUNNER_TEMP/metal2vulkan"
          wrapper="$GITHUB_WORKSPACE/third-party/metal2vulkan-n48"
          git init "$translator"
          git -C "$translator" fetch --depth=1 https://github.com/steelbrain/metal2vulkan 43c46ac8a24adf1a6e872b8a52c706ec9614fad0
          git -C "$translator" checkout --detach FETCH_HEAD
          git -C "$translator" apply "$wrapper"/patches/*.patch
          cp -R "$wrapper/n48xlate" "$translator/"
          cargo test --manifest-path "$translator/Cargo.toml" -p n48xlate --test linked --test hooks --features test-hooks

  macos-link:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned MacKernelSDK
        run: |
          git clone https://github.com/acidanthera/MacKernelSDK.git "$RUNNER_TEMP/MacKernelSDK"
          git -C "$RUNNER_TEMP/MacKernelSDK" checkout --detach 05094e5e88cec7caedbfb35e8449ed0db94bf95b
      - name: Compile and link Navi48Bringup with synthetic firmware
        shell: bash
        run: |
          firmware=src/navi48-bringup/firmware
          mkdir "$firmware"
          while read -r name digest; do
            printf 'CI compile and link fixture only\n' > "$firmware/$name.bin"
          done < tools/firmware-sha256.txt
          log="$RUNNER_TEMP/kext-build.log"
          if ! make -j2 -C src/navi48-bringup MKSDK="$RUNNER_TEMP/MacKernelSDK" all >"$log" 2>&1; then
            tail -80 "$log"
            grep -E 'error:|No rule to make target' "$log" | head -20 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done || true
            exit 1
          fi
          kext=src/navi48-bringup/build/Navi48Bringup.kext
          lipo -verify_arch x86_64 "$kext/Contents/MacOS/Navi48Bringup"
          codesign --verify "$kext"
